name: Update OpenDART financial data

on:
  workflow_dispatch:
  schedule:
    # 09:30 KST every Saturday
    - cron: "30 0 * * 6"

permissions:
  contents: write

concurrency:
  group: update-kr-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            .cache/kr_history.pkl
            .cache/dart_financials.json
          key: kr-data-${{ github.run_id }}
          restore-keys: |
            kr-data-
            kr-history-
      - run: pip install -r requirements.txt
      - name: Collect OpenDART financial data
        run: python scripts/collect_kr.py --dart-mode refresh
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - run: python -m unittest discover -s tests -v
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kr.json
          git diff --cached --quiet || git commit -m "data: update OpenDART financials"
          git pull --rebase origin main
          git push
