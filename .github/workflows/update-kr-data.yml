name: Update KR market data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/data-refresh"
  schedule:
    - cron: "45 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-kr-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/kr_history.pkl
          key: kr-history-${{ github.run_id }}
          restore-keys: |
            kr-history-
      - run: pip install -r requirements.txt
      - name: Collect KRX market data
        run: python scripts/collect_kr.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - run: python -m unittest discover -s tests -v
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kr.json
          git diff --cached --quiet || git commit -m "data: update KR unified screener"
          git push
